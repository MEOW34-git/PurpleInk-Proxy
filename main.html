<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#10131d">
	<title>Blittio Browse</title>
	<style>
		:root{color-scheme:dark;--bg:#10131d;--panel:#191e2b;--panel2:#222939;--text:#f3f5fb;--muted:#929caf;--accent:#9b8cff;--line:#2b3345}
		*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
		button,input{font:inherit}button{color:inherit;cursor:pointer}.app{height:100vh;height:100dvh;display:flex;flex-direction:column}.topbar{height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#141824}
		.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;letter-spacing:-.4px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#b7aaff,#7161ea);display:grid;place-items:center;color:#17142b;font-size:19px;font-weight:900}.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:3px}.top-actions{display:flex;align-items:center;gap:9px}.icon-btn{height:36px;width:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}.icon-btn:hover,.nav-btn:hover{background:var(--panel2)}
		.toolbar{padding:13px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#141824}.nav-controls{display:flex;gap:5px}.nav-btn{width:36px;height:38px;border:0;border-radius:9px;background:transparent;color:#bac2d2;font-size:19px}.address-wrap{height:42px;display:flex;align-items:center;gap:10px;flex:1;max-width:1000px;margin:auto;padding:0 14px;border:1px solid #343c50;border-radius:12px;background:#0e111a}.address-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #9b8cff20}.lock{color:#72d6a1;font-size:14px}.address{width:100%;color:var(--text);background:transparent;border:0;outline:0;font-size:14px}.address::placeholder{color:#778196}.go{height:36px;padding:0 16px;border:0;border-radius:9px;background:var(--accent);color:#17142b;font-weight:700}.go:hover{filter:brightness(1.1)}.open-external{display:none}.app.is-browsing .open-external{display:inline-grid;place-items:center}
		main{flex:1;display:flex;flex-direction:column;min-height:0}.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 22px 65px}.hero-mark{width:74px;height:74px;border-radius:24px;background:linear-gradient(135deg,#b7aaff,#7161ea);display:grid;place-items:center;color:#17142b;font-size:38px;font-weight:900;box-shadow:0 14px 45px #7869e83b;margin-bottom:24px}.welcome h1{font-size:clamp(30px,5vw,43px);letter-spacing:-1.6px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 28px;max-width:460px}.search{width:min(620px,100%);display:flex;gap:9px;padding:7px;border:1px solid #343c50;border-radius:15px;background:var(--panel);box-shadow:0 12px 35px #0002}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 12px;color:var(--text)}.search input::placeholder{color:#778196}.search button{padding:11px 19px;border:0;border-radius:10px;background:var(--accent);color:#17142b;font-weight:700}.hint{font-size:12px;color:#727d92;margin-top:15px}.quick-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:32px}.quick-links button{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#c7cede}.quick-links button:hover{border-color:#6559a2}
		.browser{display:none;flex:1;min-height:0;position:relative;overflow:hidden}.browser iframe{display:block;border:0;width:100%;height:100%;background:#fff}.app.is-browsing .foot{display:none}.status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#191e2bee;color:#bbc3d2;font-size:12px;pointer-events:none;white-space:nowrap}.foot{padding:12px 20px;text-align:center;color:#707b90;font-size:11px;border-top:1px solid var(--line)}
		@media(max-width:600px){.topbar{padding:0 14px}.toolbar{padding:10px;gap:5px}.nav-controls{gap:0}.nav-btn{width:32px}.address-wrap{padding:0 9px}.go{padding:0 12px}.brand small{display:none}.top-actions .icon-btn:first-child{display:none}.welcome{padding-bottom:45px}}
	</style>
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="brand"><div class="logo">B</div>Blittio Browse <small>Private web, your way</small></div>
			<div class="top-actions"><button class="icon-btn" id="homeBtn" aria-label="Home" title="Home">⌂</button><button class="icon-btn" id="reloadBtn" aria-label="Reload" title="Reload">↻</button></div>
		</header>
		<form class="toolbar" id="addressForm">
			<div class="nav-controls"><button class="nav-btn" type="button" id="backBtn" aria-label="Back" title="Back">‹</button><button class="nav-btn" type="button" id="forwardBtn" aria-label="Forward" title="Forward">›</button></div>
			<div class="address-wrap"><span class="lock" aria-hidden="true">◈</span><input class="address" id="address" autocomplete="url" spellcheck="false" placeholder="Search or enter a website address" aria-label="Search or enter a website address"></div>
			<button class="go" type="submit">Go</button>
			<button class="icon-btn open-external" id="openExternalBtn" type="button" aria-label="Open page in a new tab" title="Open page in a new tab">↗</button>
		</form>
		<main>
			<section class="welcome" id="welcome">
				<div class="hero-mark">B</div><h1>A little more room to browse.</h1><p>Search the web or enter a website address to get started with Blittio Browse.</p>
				<form class="search" id="searchForm"><input id="searchInput" placeholder="What would you like to find?" aria-label="Search the web"><button type="submit">Search</button></form>
				<div class="hint">Enter a web address, or search with DuckDuckGo</div>
				<div class="quick-links" aria-label="Quick links"><button data-url="https://www.wikipedia.org">Wikipedia</button><button data-url="https://www.archive.org">Internet Archive</button><button data-url="https://developer.mozilla.org">MDN</button></div>
			</section>
			<section class="browser" id="browser" aria-label="Browser view"><iframe id="view" title="Web page"></iframe><div class="status" id="status">Loading through Blittio</div></section>
		</main>
		<footer class="foot">Blittio Browse · Pages are provided by the websites you visit.</footer>
	</div>
	<script src="/scram/scramjet.all.js"></script>
	<script src="/baremux/index.js"></script>
	<script>
		const address = document.getElementById("address");
		const searchInput = document.getElementById("searchInput");
		const welcome = document.getElementById("welcome");
		const browser = document.getElementById("browser");
		const app = document.querySelector(".app");
		const view = document.getElementById("view");
		const status = document.getElementById("status");
		let history = [], historyIndex = -1;
		let proxyFrame = null;
		const { ScramjetController } = $scramjetLoadController();
		const scramjet = new ScramjetController({
			files: {
				wasm: "/scram/scramjet.wasm.wasm",
				all: "/scram/scramjet.all.js",
				sync: "/scram/scramjet.sync.js",
			},
		});
		const scramjetReady = scramjet.init();
		const bareConnection = new BareMux.BareMuxConnection("/baremux/worker.js");

		async function prepareProxy() {
			await scramjetReady;
			await navigator.serviceWorker.register("/sw.js");
			await navigator.serviceWorker.ready;
			const wisp = new URL("/wisp/", location.href);
			wisp.protocol = location.protocol === "https:" ? "wss:" : "ws:";
			if ((await bareConnection.getTransport()) !== "/libcurl/index.mjs") {
				await bareConnection.setTransport("/libcurl/index.mjs", [{ websocket: wisp.href }]);
			}
			if (!proxyFrame) proxyFrame = scramjet.createFrame(view);
		}

		function normalizeInput(value) {
			const text = value.trim();
			if (!text) return "";
			if (/^(https?:\/\/|about:)/i.test(text)) return text;
			if (/^[\w.-]+\.[a-z]{2,}([/:?#]|$)/i.test(text)) return "https://" + text;
			return "https://duckduckgo.com/?q=" + encodeURIComponent(text);
		}
		async function navigate(value, addHistory = true) {
			const target = normalizeInput(value);
			if (!target) return;
			let parsed;
			try { parsed = new URL(target); } catch { status.textContent = "That address could not be opened"; return; }
			if (parsed.protocol !== "https:" && parsed.protocol !== "http:") { status.textContent = "Only HTTP and HTTPS pages can be opened"; return; }
			address.value = target;
			app.classList.add("is-browsing");
			welcome.style.display = "none";
			browser.style.display = "flex";
			status.style.display = "block";
			status.textContent = "Loading through Blittio";
			try {
				await prepareProxy();
				proxyFrame.go(target);
			} catch (error) {
				status.textContent = "Blittio could not start the proxy: " + error.message;
			}
			if (addHistory) { history = history.slice(0, historyIndex + 1); history.push(target); historyIndex = history.length - 1; }
		}
		document.getElementById("addressForm").addEventListener("submit", e => { e.preventDefault(); navigate(address.value); });
		document.getElementById("openExternalBtn").addEventListener("click", () => {
			const target = normalizeInput(address.value);
			try {
				const parsed = new URL(target);
				if (parsed.protocol === "https:" || parsed.protocol === "http:") window.open(target, "_blank", "noopener,noreferrer");
			} catch { status.textContent = "That address could not be opened"; }
		});
		document.getElementById("searchForm").addEventListener("submit", e => { e.preventDefault(); navigate(searchInput.value); });
		document.querySelectorAll("[data-url]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.url)));
		document.getElementById("homeBtn").addEventListener("click", () => { view.removeAttribute("src"); browser.style.display = "none"; welcome.style.display = "flex"; app.classList.remove("is-browsing"); address.value = ""; });
		document.getElementById("reloadBtn").addEventListener("click", () => { if (proxyFrame) proxyFrame.reload(); else if (historyIndex >= 0) navigate(history[historyIndex], false); });
		document.getElementById("backBtn").addEventListener("click", () => { if (historyIndex > 0) { historyIndex--; navigate(history[historyIndex], false); } else if (proxyFrame) proxyFrame.back(); });
		document.getElementById("forwardBtn").addEventListener("click", () => { if (historyIndex < history.length - 1) { historyIndex++; navigate(history[historyIndex], false); } else if (proxyFrame) proxyFrame.forward(); });
		view.addEventListener("load", () => { if (view.src && view.src !== "about:blank") status.style.display = "none"; });
		view.addEventListener("error", () => { status.textContent = "Could not load this page. The proxy service may be unavailable."; });
	</script>
</body>
</html>
